; Власна прошивка для Wi-Fi-модуля насоса Sirio (ESP-WROOM-02, ESP8266EX, 4 МБ).
; Замінює стокову WiNET: наша веб-морда (PROGMEM) + майстер протоколу J12 до ATmega.
; UART0 (Serial) зайнятий лінією J12 через перетворювач рівнів — НЕ друкувати в Serial.
; Налаштування/параметри — в EEPROM. Заливати треба лише firmware.bin @ 0x0.

[env:esp_wroom_02]
platform = espressif8266
board = esp12e                 ; ESP8266 4 МБ (сумісно з ESP-WROOM-02 4 МБ)
framework = arduino
monitor_speed = 74880
upload_speed = 115200
build_flags =
    -D ATMEGA_BAUD=19200
